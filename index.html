<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBoard</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>SkillBoard</h1>
            <p>Internship preparation tracker</p>
        </div>

        <button id="addTaskBtn" class="primary-btn">
            + Add Task
        </button>
    </header>

    <main class="container">

        <section class="stats">
            <div class="stat-card">
                <span class="stat-number" id="totalTasks">0</span>
                <span class="stat-label">Total tasks</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="progressTasks">0</span>
                <span class="stat-label">In progress</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="doneTasks">0</span>
                <span class="stat-label">Completed</span>
            </div>
        </section>

        <section class="toolbar">
            <input type="text" id="searchInput" placeholder="Search tasks...">

            <select id="categoryFilter">
                <option value="all">All categories</option>
                <option value="javascript">JavaScript</option>
                <option value="algorithms">Algorithms</option>
                <option value="english">English</option>
                <option value="project">Project</option>
            </select>

            <select id="priorityFilter">
                <option value="all">All priorities</option>
                <option value="high">High priority</option>
                <option value="medium">Medium priority</option>
                <option value="low">Low priority</option>
            </select>

            <button id="clearFiltersBtn" class="clear-btn" type="button">
                Clear
            </button>
        </section>

        <section class="board">

            <div class="column">
                <h2>To Learn</h2>
                <div class="task-list" id="todoList"></div>
            </div>

            <div class="column">
                <h2>In Progress</h2>
                <div class="task-list" id="progressList"></div>
            </div>

            <div class="column">
                <h2>Done</h2>
                <div class="task-list" id="doneList"></div>
            </div>

        </section>

    </main>

    <div class="modal hidden" id="taskModal">
        <div class="modal-content">

            <div class="modal-header">
                <h2>Add new task</h2>

                <button class="close-btn" id="closeModalBtn" type="button">
                    ×
                </button>
            </div>

            <form id="taskForm">

                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" placeholder="Example: Learn JavaScript basics">
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" placeholder="Add a short task description"></textarea>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="taskCategory">Category</label>

                        <select id="taskCategory">
                            <option value="javascript">JavaScript</option>
                            <option value="algorithms">Algorithms</option>
                            <option value="english">English</option>
                            <option value="project">Project</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskPriority">Priority</label>

                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="button" class="secondary-btn" id="cancelBtn">
                        Cancel
                    </button>

                    <button type="submit" class="primary-btn">
                        Save Task
                    </button>
                </div>

            </form>

        </div>
    </div>

    <script src="./js/app.js"></script>
</body>

</html>
